name: canary

# The newest Velaris release, as a user gets it, every day: from PyPI, npm,
# Docker, the GitHub Action and the standalone executables. Each runs
# discount.vel and refuses a program that fetches a URL (canary.py). A
# failure opens an issue in this repository, or comments on the open one.

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI, Python ${{ matrix.python }}, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: pip install "velaris-lang[full]" into a new virtual environment
        shell: bash
        run: |
          python -m venv venv
          if [ -d venv/Scripts ]; then bin=venv/Scripts; exe=.exe; else bin=venv/bin; exe=; fi
          "$bin/python$exe" -m pip install "velaris-lang[full]"
          echo "VELARIS=$bin/velaris$exe" >> "$GITHUB_ENV"
      - name: The canary
        shell: bash
        run: python canary.py --name "PyPI, ${{ matrix.os }}, Python ${{ matrix.python }}" --command "$VELARIS"

  npm:
    name: npm, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # the npm package is a wrapper that runs the compiler from PyPI
      - name: The compiler from PyPI, then the package from npm
        shell: bash
        run: |
          python -m pip install velaris-lang
          npm install -g velaris-lang
          echo "WRAPPER=$(npm root -g)/velaris-lang/bin/velaris.js" >> "$GITHUB_ENV"
      - name: The canary
        shell: bash
        run: python canary.py --name "npm, ${{ matrix.os }}" --command "node $WRAPPER"

  docker:
    name: the Docker image of the newest release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the Dockerfile at the newest release's tag
        run: |
          tag=$(gh release view --repo gowrishankar-infra/velaris-lang --json tagName --jq .tagName)
          echo "newest release: $tag"
          docker build -t velaris:canary "https://github.com/gowrishankar-infra/velaris-lang.git#$tag"
      - name: The canary
        run: python canary.py --name "Docker image" --docker velaris:canary

  binary:
    name: the standalone executable, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, asset: velaris-linux}
          - {os: macos-latest, asset: velaris-macos}
          - {os: windows-latest, asset: velaris-windows.exe}
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download it from the newest release, and check its checksum
        shell: bash
        run: |
          gh release download --repo gowrishankar-infra/velaris-lang \
            --pattern "${{ matrix.asset }}" --pattern "${{ matrix.asset }}.sha256"
          python - "${{ matrix.asset }}" <<'EOF'
          import hashlib, sys
          name = sys.argv[1]
          want = open(name + ".sha256").read().split()[0]
          got = hashlib.sha256(open(name, "rb").read()).hexdigest()
          assert got == want, (got, want)
          print(name, "sha256", got, "matches the release's checksum")
          EOF
          chmod +x "${{ matrix.asset }}"
      - name: The canary
        shell: bash
        run: python canary.py --name "standalone executable, ${{ matrix.os }}" --command "${{ matrix.asset }}"

  action:
    name: the GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Dependabot moves this to each new release
      - uses: gowrishankar-infra/velaris-lang@v8.1.1
        with:
          files: discount.vel
          sarif: "false"
          capabilities: "off"
      - name: The canary
        run: python canary.py --name "GitHub Action" --command velaris

  report:
    name: an issue when anything failed
    needs: [pypi, npm, docker, binary, action]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: One issue, or a comment on the one already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="canary: the newest Velaris release failed a check"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          body="A canary run failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
